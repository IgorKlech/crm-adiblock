<!-- Variante COMPACTA reversa — para FUNDO ESCURO (navbar do CRM, que agora e
     o azul da marca #0f2c54, e o cartao de login no tema escuro).
     Mesmas cores da logo-adiblock-light.svg do site: placa branca, chevron
     azul da marca e o traco em amarelo. Sem tagline, pelo mesmo motivo da
     versao clara: a 38px de altura ela viraria mancha. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 12 286 60" width="286" height="60" role="img" aria-label="Adiblock">
  <rect x="6" y="12" width="60" height="60" rx="15" fill="#ffffff"/>
  <path d="M22 58 L36 26 L50 58" fill="none" stroke="#1f3fa0" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 46.5 L44 46.5" fill="none" stroke="#ffd200" stroke-width="5.6" stroke-linecap="round"/>
  <text x="82" y="54" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#ffffff">ADIBLOCK</text>
</svg>
